services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: domain_processing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d domain_processing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DOMAIN_PROCESSING_DATABASE_URL: "postgresql+asyncpg://user:password@db:5432/domain_processing"
      DOMAIN_PROCESSING_REDIS_HOST: "redis"
      DOMAIN_PROCESSING_REDIS_PORT: "6379"
      DOMAIN_PROCESSING_REDIS_DB: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  tests:
    build: .
    environment:
      DOMAIN_PROCESSING_TEST_DATABASE_URL: "postgresql+psycopg2://user:password@db:5432/domain_processing_test"
      DOMAIN_PROCESSING_TEST_ASYNC_DATABASE_URL: "postgresql+asyncpg://user:password@db:5432/domain_processing_test"
      DOMAIN_PROCESSING_REDIS_HOST: "redis"
      DOMAIN_PROCESSING_REDIS_PORT: "6379"
      DOMAIN_PROCESSING_REDIS_DB: "1"
    entrypoint: ["python", "-m", "pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - test

volumes:
  postgres_data:
  redis_data:
